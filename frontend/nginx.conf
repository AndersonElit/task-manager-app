server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy auth calls a Floci Cognito (desde el pod, floci es accesible por nombre en floci-net)
    location /cognito/ {
        proxy_pass http://floci:4566/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy API calls directamente al servicio k8s (evita API Gateway de Floci)
    # Rewrite elimina el prefijo del API Gateway antes de pasar al backend
    location ~ ^/restapis/[^/]+/local/_user_request_/ {
        rewrite ^/restapis/[^/]+/local/_user_request_/(.*) /$1 break;
        proxy_pass http://tasks-creator:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
